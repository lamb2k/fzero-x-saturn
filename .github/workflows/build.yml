name: Saturn port foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fzero-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hygiene:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Publication hygiene scan of every tracked file
        run: python3 tools/hygiene_scan.py
      - name: Scan controls (planted ROM stub, ROM header, home paths must fail)
        run: python3 -m unittest tests/test_hygiene.py -v
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init third_party/SH2ZAM
      - name: Check core with GCC and Clang
        run: |
          make test CC=gcc BUILD=build/gcc
          make test CC=clang BUILD=build/clang
          make sanitize CC=clang
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Decomp submodule (code only; no ROM, no assets)
        run: |
          git submodule update --init upstream/G-Diffuser
          git -C upstream/G-Diffuser submodule update --init decomp
          git -C upstream/G-Diffuser submodule update --init libultraship
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib clang
      - name: Required source shader material gate and mutation controls
        run: |
          test -f upstream/G-Diffuser/libultraship/src/fast/shaders/opengl/default.shader.glsl
          python3 -m unittest discover -s tests -p test_material.py -v
          FZX_TEST_CFLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' python3 -m unittest discover -s tests -p test_material.py -v
      - name: G1.2 reference harness (gcc/clang x -O0/-O2 determinism, regression, control)
        run: bash ref/check.sh
      - name: SH-2 float library, exhaustive conversions and 2.6M operand pairs against SSE
        run: |
          make build/host/test-float
          build/host/test-float 40
      - name: Correctly rounded sqrtf of the SH-2 reference build, all 2^32 inputs against SSE
        run: |
          gcc -O2 -msse2 -fno-builtin -o build/test-sqrtf ref/sat/test_soft_sqrtf.c ref/sat/soft_sqrtf.c
          build/test-sqrtf
  saturn:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init third_party/SH2ZAM
      - name: Build native big-endian SH-2 disc image
        run: |
          set -euo pipefail
          docker pull ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6
          python3 tools/model_probe/make_fixture.py
          docker run --rm -v "$PWD:/work" -w /work ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 /bin/bash -c '
            set -euo pipefail
            export PATH="$YAUL_INSTALL_ROOT/bin:$PATH"
            "${YAUL_ARCH_SH_PREFIX}-gcc" --version > saturn/toolchain.txt
            make -C saturn
            make -C tools/model_probe FZX_MODEL_ART=fixture
            make -C tools/model_probe FZX_MODEL_ART=fixture FZX_MODEL_DIVU=1
            "${YAUL_ARCH_SH_PREFIX}-readelf" -h saturn/build/fzero-x-saturn.elf > saturn/elf-header.txt
            "${YAUL_ARCH_SH_PREFIX}-size" saturn/build/fzero-x-saturn.elf > saturn/size.txt
            "${YAUL_ARCH_SH_PREFIX}-nm" saturn/build/fzero-x-saturn.elf > saturn/symbols.txt
            grep -q "big endian" saturn/elf-header.txt
            grep -q "sh2" saturn/elf-header.txt
            sha256sum saturn/fzero-x-saturn.iso > saturn/image-sha256.txt
          '
      - name: A hand-edited generated course must stop the build (G0.3 control)
        run: |
          set -euo pipefail
          python3 -c "import sys; sys.path.insert(0, 'tests'); import test_import_course as t; open('/tmp/fixture.bin', 'wb').write(t.synthetic_record())"
          python3 tools/import_course.py --record /tmp/fixture.bin --byte-order big --output generated/course.h
          sh tools/check_receipt.sh generated/course.receipt
          echo '/* edited */' >> generated/course.h
          if docker run --rm -v "$PWD:/work" -w /work ijacquez/yaul@sha256:b6d272204767cd0a734139dd3a2ab298ef5912fb7b7224b78e6d9fac1a7825a6 \
               /bin/bash -c 'export PATH="$YAUL_INSTALL_ROOT/bin:$PATH"; make -C saturn FZX_IMPORTED=1' > /tmp/stale.log 2>&1; then
            cat /tmp/stale.log; echo "FAIL: the stale header was accepted"; exit 1
          fi
          cat /tmp/stale.log
          grep -q "stale: course.h" /tmp/stale.log
          rm -f generated/course.h generated/course.json generated/course.receipt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fzero-x-saturn-native
          path: |
            saturn/*.iso
            saturn/*.cue
            saturn/*.bin
            saturn/*.txt
            saturn/build/*.elf
            saturn/build/*.sym
          if-no-files-found: error
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: git submodule update --init third_party/SH2ZAM
      - name: Install build and browser test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
          python3 -m venv /tmp/fzero-web-tests
          /tmp/fzero-web-tests/bin/pip install playwright
          /tmp/fzero-web-tests/bin/playwright install --with-deps chromium
      - name: Build and test the shared C core in WebAssembly
        run: |
          make web
          node --check web/app.js
          /tmp/fzero-web-tests/bin/python web/test-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fzero-x-saturn-web
          path: |
            web/
            build/web-test/
      - name: Stage public workbench
        run: |
          mkdir -p build/site
          cp web/index.html web/style.css web/app.js web/fzero.wasm web/fzero-module.js build/site/
          cp LICENSE NOTICE.md build/site/
          touch build/site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [hygiene, host, saturn, web]
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/deploy-pages@v4
        id: deployment
